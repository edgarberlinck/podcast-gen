services:
  studio:
    build:
      context: .
    env_file:
      - .env
    environment:
      CODEX_HOME: /codex
      HOME: /codex
      STUDIO_DATA_DIR: /app/data
      STUDIO_HOST: 0.0.0.0
      STUDIO_PORT: 8000
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "127.0.0.1:${STUDIO_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - "${CODEX_HOME_HOST:-${HOME}/.codex}:/codex"
    restart: unless-stopped
